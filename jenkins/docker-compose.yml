services:
  jenkins-docker:
    image: docker:dind
    container_name: jenkins-docker
    privileged: true
    environment:
      DOCKER_TLS_CERTDIR: "/certs"
    volumes:
      - jenkins-docker-certs:/certs/client
      - jenkins-data:/var/jenkins_home
    ports:
      - "2376:2376"
    networks:
      jenkins:
        aliases:
          - docker   # IMPORTANT → allows Jenkins to resolve "docker"
    command: --storage-driver overlay2

  my-jenkins:
    image: my-jenkins
    container_name: my-jenkins
    restart: on-failure
    depends_on:
      - jenkins-docker   # IMPORTANT → ensures DIND starts first
    environment:
      DOCKER_HOST: "tcp://docker:2376"      # hostname from alias above
      DOCKER_CERT_PATH: "/certs/client"
      DOCKER_TLS_VERIFY: "1"
      JAVA_OPTS: >
        -Dhudson.model.DirectoryBrowserSupport.CSP="default-src 'self' 'unsafe-inline';
        style-src 'self' 'unsafe-inline';"
    volumes:
      - jenkins-data:/var/jenkins_home
      - jenkins-docker-certs:/certs/client:ro
    ports:
      - "9000:8080"
      - "50000:50000"
    networks:
      jenkins:
        aliases:
          - jenkins

  backend:
    build: ../bugtracker-backend
    container_name: backend
    ports:
      - "10000:10000"
    environment:
      - PORT=10000
    networks:
      - jenkins
  frontend:
    build:
      context: ../bugtracker-frontend
      args:
        NEXT_PUBLIC_API_URL: "http://backend:10000"
    container_name: frontend
    depends_on:
      - backend
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: "http://backend:10000"
    networks:
      - jenkins

networks:
  jenkins:
    driver: bridge

volumes:
  jenkins-docker-certs:
  jenkins-data:
