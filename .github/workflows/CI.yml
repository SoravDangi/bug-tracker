  # ======================================================
  # JOB 7: POST DEPLOYMENT TESTS
  # This job runs Playwright tests against the live production site.
  # Ensures deployment works correctly.
  # ======================================================
  post-deployment-tests:
    needs: [deploy-frontend, deploy-backend]
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout code
      - uses: actions/checkout@v4
      
      # Step 2: Install Playwright for production testing
      - name: Install Playwright
        working-directory: ./tests-e2e
        run : |
          npm ci
          npx playwright install --with-deps

      # Step 3: Run tests against the live deployed Netlify site
      - name: Run Post Deployment Tests
        working-directory: ./tests-e2e
        env: 
#          PLAYWRIGHT_TEST_BASE_URL: "https://bugtracker12.netlify.app/"
          PLAYWRIGHT_TEST_BASE_URL: "https://bug-tracker-phi-one.vercel.app/"
        run: |
          npx playwright test 

      # Step 4: Upload test report artifacts
      - name : Upload Post Deployment Test Report
        if: always()
        uses: actions/upload-artifact@v4
        with: 
          name: post-deployment-test-results
          path: ./tests-e2e/playwright-report
          retention-days: 30
     
      # Step 5: Publish readable test report
      - name: Publish Post Deployment Test Results
        uses: dorny/test-reporter@v1
        if: always()
        with: 
          name: Post Deployment Test Report
          path: ./tests-e2e/test-results/results.xml
          reporter: jest-junit

