name: CI

# ------------------------------------------------------
# When should this CI pipeline run?
# - Whenever someone pushes code to the main branch
# - Whenever someone creates a pull request into main
# - Whenever someone manually triggers the workflow
# ------------------------------------------------------
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:

  # ======================================================
  # JOB 1: BACKEND UNIT TESTS
  # This job tests the backend code (GoLang) automatically.
  # It ensures backend logic works and generates a test report.
  # ======================================================
  unit-tests-backend:
    runs-on: ubuntu-latest      # Use a Linux machine to run the job
    outputs:
      coverage: ${{ steps.test-backend.outputs.report }}    # Export coverage details

    steps:
      # Step 1: Download the repository code
      - uses: actions/checkout@v4

      # Step 2: Install Go programming language
      - uses: actions/setup-go@v4
        with:
          go-version: "1.21"
          cache-dependency-path: bugtracker-backend/go.sum

      # Step 3: Install reporting tool to convert test results into readable format
      - name: Install go-junit-report
        run: |
          go install github.com/jstemmer/go-junit-report@latest
          echo "$HOME/go/bin" >> $GITHUB_PATH

      # Step 4: Run backend unit tests & calculate coverage
      - name: Execute Backend Unit Tests
        id: test-backend
        working-directory: ./bugtracker-backend
        run: |
          # Run Go tests and calculate coverage
          go test -json -coverprofile=coverage.out -covermode=atomic ./...
          go tool cover -func=coverage.out > coverage.txt

          # Show coverage summary in GitHub UI
          echo "## Go Test Coverage Report" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat coverage.txt >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

          # Save coverage as output value for later jobs
          echo "report<<EOP" >> $GITHUB_OUTPUT
          cat coverage.txt >> $GITHUB_OUTPUT
          echo "EOP" >> $GITHUB_OUTPUT

          # Generate JUnit-style test report
          go test -v ./... 2>&1 | go-junit-report > test-results.xml

      # Step 5: Upload backend test report into GitHub UI
      - uses: dorny/test-reporter@v1
        if: always()
        with:
          name: Backend Unit Tests Report
          path: bugtracker-backend/test-results.xml
          reporter: java-junit

  # ======================================================
  # JOB 2: FRONTEND UNIT TESTS
  # Runs unit tests for React/Next.js frontend.
  # Ensures UI components work correctly.
  # ======================================================
  unit-tests-frontend:
    runs-on: ubuntu-latest
    outputs:
      coverage: ${{ steps.test-frontend.outputs.report }}

    steps:
      # Step 1: Checkout code
      - uses: actions/checkout@v4

      # Step 2: Install Node.js so tests can run
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: bugtracker-frontend/package-lock.json

      # Step 3: Install dependencies and run all frontend tests
      - name: Run Frontend Unit Tests
        id: test-frontend
        working-directory: ./bugtracker-frontend
        run: |
          npm ci
          npm test | tee full_output.txt

          # Save summary to GitHub UI
          echo "## Frontend Test Coverage Report" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat full_output.txt >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

          # Save report for PR comment job
          echo "report<<EOP" >> $GITHUB_OUTPUT
          cat full_output.txt >> $GITHUB_OUTPUT
          echo "EOP" >> $GITHUB_OUTPUT

      # Step 4: Upload frontend test report
      - uses: dorny/test-reporter@v1
        if: always()
        with:
          name: Frontend Unit Tests Report
          path: bugtracker-frontend/test-results.xml
          reporter: jest-junit


  # ======================================================
  # JOB 3: COMMENT TEST COVERAGE ON PULL REQUESTS
  # This adds automatic comments showing coverage results.
  # Only runs for pull requests (not for normal pushes).
  # ======================================================
  create-coverage-comment:
    if: github.event_name == 'pull_request'
    needs: [unit-tests-backend, unit-tests-frontend]
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write

    steps:
      # Comment backend coverage
      - uses: peter-evans/create-or-update-comment@v4
        with:
          issue-number: ${{ github.event.pull_request.number }}
          body: |
            ## Backend Test Coverage Report
            ${{ needs.unit-tests-backend.outputs.coverage }}

      # Comment frontend coverage
      - uses: peter-evans/create-or-update-comment@v4
        with:
          issue-number: ${{ github.event.pull_request.number }}
          body: |
            ## Frontend Test Coverage Report
            ${{ needs.unit-tests-frontend.outputs.coverage }}


  # ======================================================
  # JOB 4: API TESTS + PERFORMANCE TESTS + BUILD APP
  # This job builds the app, starts the backend, runs API tests,
  # runs Playwright API tests, and runs performance tests.
  # ======================================================
  api-e2e-perf-tests:
    needs: [unit-tests-backend, unit-tests-frontend]
    runs-on: ubuntu-latest

    steps:
      # Step 1: Download code
      - uses: actions/checkout@v4

      # Step 2: Build frontend for integration testing
      - name: Build Frontend
        working-directory: ./bugtracker-frontend
        env:
          NEXT_PUBLIC_API_URL: "http://localhost:10000/api"
        run: |
          npm ci
          npm run build

      # Step 3: Install Playwright browsers
      - name: Install Playwright Browsers
        run: |
          npm i -g playwright
          playwright install --with-deps

      # Step 4: Start backend + database via Docker
      - name: Start Application
        run: |
          docker compose up --build -d
          echo "Waiting for backend on :10000 health..."
          curl --retry 20 --retry-delay 3 --retry-all-errors http://localhost:10000/api/health

      # Step 5: Run API automated tests
      - name: Run API Tests
        working-directory: ./tests-api
        env:
          PLAYWRIGHT_TEST_BASE_URL: "http://localhost:10000/api/"
        run: |
          npm ci
          npx playwright install --with-deps
          npx playwright test

      # (Optional E2E Tests commented out)
      #- name: Run E2E Tests
      # working-directory: ./tests-e2e 
      # env: 
          # PLAYWRIGHT_TEST_BASE_URL: "http://localhost:3000"
          # CI: "1" 
          # run: | 
            # npm ci 
            # npx playwright install --with-deps 
            # npx playwright test
      # Step 6: Run performance tests using k6
      - uses: grafana/setup-k6-action@v1
      - uses: grafana/run-k6-action@v1
        with:
          path: tests-perf/script.js
          flags: --out json=summary.json

      # Step 7: Stop Docker services
      - name: Shutdown App
        run: docker compose down

      # Step 8: Upload test result artifacts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: api-test-results
          path: ./tests-api/test-results/

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: api-playwright-report
          path: ./tests-api/playwright-report/

      # Upload performance test results
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: performance-raw-results
          path: summary.json
      #Upload e2e test results     
    # - uses: actions/upload-artifact@v4 
      # if: always() 
      # with: 
          # name: e2e-playwright-report 
          # path: ./tests-e2e/playwright-report/ 
      # Step 9: Publish API test report
      - uses: dorny/test-reporter@v1
        if: always()
        with:
          name: API Tests Report
          path: ./tests-api/test-results/*.xml
          reporter: jest-junit
    # - uses: dorny/test-reporter@v1 
      # if: always() 
      # with: 
        # name: E2E Tests Report 
        # path: ./tests-e2e/test-results/*.xml 
        # reporter: jest-junit     


  # ======================================================
  # JOB 5: DEPLOY BACKEND TO RENDER
  # Automatically triggers a new deployment on Render hosting.
  # ======================================================
  deploy-backend:
    needs: [api-e2e-perf-tests]
    runs-on: ubuntu-latest

    steps:
      # Call Render API to deploy backend service
      - name: Deploy Backend to Render
        run: |
          curl -X POST \
            -H "Authorization: Bearer ${{ secrets.RENDER_API_KEY }}" \
            -H "Content-Type: application/json" \
            -d '{"clearCache": false}' \
            https://api.render.com/v1/services/${{ secrets.RENDER_BACKEND_SERVICE_ID }}/deploys


  # ======================================================
  # JOB 6: DEPLOY FRONTEND TO NETLIFY
  # Builds the React/Next.js frontend and deploys to Netlify hosting.
  # ======================================================
  deploy-frontend:
    needs: [api-e2e-perf-tests]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Vercel CLI
        run: npm install -g vercel

      - name: Pull Vercel Environment Information
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
        working-directory: ./bugtracker-frontend

      - name: Build Project
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
        working-directory: ./bugtracker-frontend

      - name: Deploy to Vercel
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
        working-directory: ./bugtracker-frontend



